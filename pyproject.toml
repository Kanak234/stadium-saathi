[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stadium-saathi"
version = "1.0.0"
description = "Smart Stadium Operations & Tournament Operations Multilingual Assistant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Kanak" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "streamlit>=1.36.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
stadium-saathi = "assistant:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "build",
]

[tool.setuptools]
py-modules = ["app", "assistant"]

[tool.setuptools.data-files]
"data" = ["stadium_data.json"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-v --cov=assistant --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
